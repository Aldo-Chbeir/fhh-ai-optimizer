<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FHH AI Optimizer — Overview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      color: #0A1F44;
      background: #F4F6FA;
    }
    button { font-family: inherit; }

    /* thin scrollbars in main + chat panes */
    main::-webkit-scrollbar, aside ::-webkit-scrollbar,
    [data-scroll]::-webkit-scrollbar { width: 8px; height: 8px; }
    main::-webkit-scrollbar-thumb, aside ::-webkit-scrollbar-thumb,
    [data-scroll]::-webkit-scrollbar-thumb {
      background: #D8DEE8; border-radius: 4px;
    }
    main::-webkit-scrollbar-thumb:hover, aside ::-webkit-scrollbar-thumb:hover {
      background: #B8C0CE;
    }

    /* Markdown rendered inside assistant chat bubbles. Tight margins so
       <p>/<ul>/<table> don't blow the bubble out with browser defaults. */
    .fhh-chat-md > div > *:first-child { margin-top: 0; }
    .fhh-chat-md > div > *:last-child  { margin-bottom: 0; }
    .fhh-chat-md p          { margin: 0 0 8px; }
    .fhh-chat-md ul,
    .fhh-chat-md ol         { margin: 4px 0 8px; padding-left: 20px; }
    .fhh-chat-md li         { margin: 2px 0; }
    .fhh-chat-md li > p     { margin: 0; }
    .fhh-chat-md strong     { font-weight: 600; color: #0A1F44; }
    .fhh-chat-md em         { font-style: italic; }
    .fhh-chat-md a          { color: #1B3568; text-decoration: underline; }
    .fhh-chat-md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      background: #E6EAF1; padding: 1px 5px; border-radius: 4px;
    }
    .fhh-chat-md pre {
      margin: 6px 0; padding: 8px 10px;
      background: #1A2438; color: #E6EAF1;
      border-radius: 8px; overflow-x: auto;
      font-size: 12.5px; line-height: 1.45;
    }
    .fhh-chat-md pre code { background: transparent; color: inherit; padding: 0; }
    .fhh-chat-md h1, .fhh-chat-md h2, .fhh-chat-md h3,
    .fhh-chat-md h4, .fhh-chat-md h5, .fhh-chat-md h6 {
      font-size: 13.5px; font-weight: 700; margin: 8px 0 4px; color: #0A1F44;
    }
    .fhh-chat-md blockquote {
      margin: 4px 0; padding: 2px 10px;
      border-left: 3px solid #C9D2E0; color: #4B5563;
    }
    .fhh-chat-md table { border-collapse: collapse; margin: 6px 0; font-size: 12.5px; }
    .fhh-chat-md th, .fhh-chat-md td {
      border: 1px solid #DCE2EC; padding: 4px 8px; text-align: left;
    }
    .fhh-chat-md th { background: #EEF2F8; font-weight: 600; }
    .fhh-chat-md hr { border: 0; border-top: 1px solid #DCE2EC; margin: 8px 0; }

    /* loading dots in chat */
    .fhh-dots { display: inline-flex; gap: 3px; }
    .fhh-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: #6B7280; opacity: .35;
      animation: fhhdot 1.1s infinite ease-in-out;
    }
    .fhh-dots span:nth-child(2) { animation-delay: .15s; }
    .fhh-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes fhhdot {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!--
    FullCalendar v6 "Standard Bundle" (UMD, classic-script). Exposes
    window.FullCalendar.{Calendar, ...plugins}. CSS is auto-injected by
    the bundle on first construction, so no separate <link> needed.
    Loaded as a regular <script> (not type="module") so it slots into
    the existing global-script pattern alongside React/ReactDOM/Babel.
  -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <!--
    Markdown → HTML for the chat assistant bubble. The Anthropic model
    emits markdown (bold, bullets, the occasional table); we parse it
    with `marked` and sanitize the result with DOMPurify before passing
    it to dangerouslySetInnerHTML. Both are classic UMD scripts that
    expose window.marked and window.DOMPurify.
  -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <!--
    Live API client. Replaces the legacy mock_data.jsx (kept on disk as
    mock_data.jsx.bak). Loads BEFORE any screen so window.api is defined
    by the time React renders.

    To point the UI at a different backend, set window.API_BASE_URL above
    this script tag, e.g.:
        <script>window.API_BASE_URL = "http://localhost:8000";</script>
  -->
  <script src="src/api_client.jsx"></script>
  <script type="text/babel" src="src/login.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/overview.jsx"></script>
  <script type="text/babel" src="src/machine_detail.jsx"></script>
  <script type="text/babel" src="src/alerts.jsx"></script>
  <script type="text/babel" src="src/demand_forecast.jsx"></script>
  <script type="text/babel" src="src/maintenance_entry.jsx"></script>
  <script type="text/babel" src="src/calendar.jsx"></script>
  <script type="text/babel" src="src/chat.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
